<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Expense Tracker & Reminder</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-main: #333333;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        /* Total Expense Card */
        .total-card {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .total-card span {
            font-size: 13px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total-card h3 {
            font-size: 28px;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: #4b5563;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            background: #f9fafb;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: #fff;
        }

        button.add-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            transition: background 0.3s;
            margin-top: 5px;
        }

        button.add-btn:hover {
            background-color: var(--primary-hover);
        }

        /* History Section */
        .history-title {
            font-size: 16px;
            font-weight: 600;
            margin: 25px 0 12px 0;
            color: #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        ul {
            list-style-type: none;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .expense-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
        }

        .expense-info p {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
        }

        .expense-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .expense-amount {
            font-weight: 600;
            font-size: 15px;
            color: var(--danger);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 15px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2><i class="fas fa-wallet"></i> Expense Tracker</h2>
        <p class="subtitle">Manage your daily spending & reminders</p>

        <!-- Total Display Card -->
        <div class="total-card">
            <span>Total Expenses</span>
            <h3>₹<span id="totalAmount">0.00</span></h3>
        </div>

        <!-- Input Form -->
        <div class="form-group">
            <label for="expenseTitle">Expense Title</label>
            <input type="text" id="expenseTitle" placeholder="e.g., Grocery, Petrol, Netflix">
        </div>

        <div class="form-group">
            <label for="expenseAmount">Amount (₹)</label>
            <input type="number" id="expenseAmount" placeholder="e.g., 350">
        </div>

        <div class="form-group">
            <label for="expenseCategory">Category</label>
            <select id="expenseCategory">
                <option value="Food">🍔 Food & Drinks</option>
                <option value="Travel">🚗 Travel & Transport</option>
                <option value="Bills">⚡ Bills & Utilities</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Other">📦 Other</option>
            </select>
        </div>

        <button class="add-btn" onclick="addExpense()"><i class="fas fa-plus"></i> Add Expense</button>

        <div class="history-title">
            <span>Recent Transactions</span>
        </div>
        <ul id="expenseList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
